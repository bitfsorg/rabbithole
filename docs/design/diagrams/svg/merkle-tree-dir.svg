<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20SF%20Pro%20Display%2C%20system-ui%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, SF Pro Display, system-ui, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
